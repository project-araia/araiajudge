[project]
name = "araiajudge"
version = "0.1.0"
description = "Judge sectionized document corpora with ANL inference services (requests-only)"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4,<9",
    "requests>=2.34,<3",
    "rich>=14,<15",
]

[project.scripts]
araiajudge = "araiajudge.cli:agentic_judge_dataset"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=9.1,<10"]
